<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Purrsor fixture: calendar-like app</title>
  <!--
    A stand-in for Google Calendar's structure: a 64px header, a sidebar of
    clickable divs, a grid of jsaction-style cells that set their own cursor,
    and the cases the cursor has to survive (author !important, shadow roots,
    iframes, dialogs, a head rewrite). data-expect is what Purrsor should
    leave on the element while the button is up; it defaults to "idle".
  -->
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.4 system-ui, sans-serif; color: #1f1f1f; }
    header { position: fixed; inset: 0 0 auto 0; height: 64px; display: flex; align-items: center; gap: 8px; padding: 0 8px; background: #f8fafd; border-bottom: 1px solid #dadce0; z-index: 2; }
    header .spacer { flex: 1; }
    .icon-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; }
    .icon-btn:hover { background: #e8eaed; }
    .pill { padding: 8px 16px; border: 1px solid #747775; border-radius: 20px; background: none; }
    aside { position: fixed; top: 64px; left: 0; bottom: 0; width: 256px; padding: 16px; overflow: auto; border-right: 1px solid #dadce0; }
    .create { padding: 16px 20px; border-radius: 16px; background: #c2e7ff; cursor: pointer; display: inline-block; }
    .mini { display: grid; grid-template-columns: repeat(7, 28px); gap: 2px; margin: 16px 0; }
    .mini .day { height: 28px; display: grid; place-items: center; border-radius: 50%; cursor: pointer; font-size: 12px; }
    main { margin: 64px 0 0 256px; padding: 16px; }
    .grid { display: grid; grid-template-columns: repeat(7, 1fr); border-left: 1px solid #dadce0; }
    .grid .slot { height: 48px; border-right: 1px solid #dadce0; border-bottom: 1px solid #dadce0; cursor: pointer; position: relative; }
    .grid .chip { position: absolute; inset: 4px; background: #039be5; color: #fff; border-radius: 4px; padding: 2px 6px; font-size: 12px; }
    /* A site rule that is itself !important, with higher specificity than Purrsor's. */
    .grid .slot .chip { cursor: pointer !important; }
    section.cases { margin-top: 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
    .case { border: 1px dashed #aaa; padding: 12px; min-height: 64px; }
    .resize { height: 8px; background: #ccc; cursor: ns-resize; margin-top: 8px; }
    .grab { cursor: grab; }
    .player { cursor: none; background: #222; color: #eee; }
    iframe { border: 1px solid #aaa; width: 100%; }
    #report { margin-top: 24px; border-collapse: collapse; font-size: 12px; }
    #report td, #report th { border: 1px solid #ddd; padding: 2px 6px; text-align: left; }
    #report .fail { background: #fde7e9; }
  </style>
</head>
<body>
  <header>
    <div class="icon-btn" role="button" data-case="header: main menu (x 8, y 12)">☰</div>
    <button class="pill" data-case="header: Today button">Today</button>
    <div class="icon-btn" data-case="header: previous week">‹</div>
    <div class="icon-btn" data-case="header: next week">›</div>
    <span data-case="header: date title">November 2026</span>
    <div class="spacer"></div>
    <input type="search" placeholder="Search" style="cursor: text" data-case="header: search input (site cursor: text)">
    <div class="icon-btn" data-case="header: settings (right edge)">⚙</div>
  </header>

  <aside>
    <div class="create" jsaction="click:create" data-case="sidebar: Create (jsaction div, cursor: pointer)">＋ Create</div>
    <div class="mini" id="mini"></div>
    <label data-case="sidebar: calendar checkbox label"><input type="checkbox" checked data-case="sidebar: checkbox"> Tim</label>
  </aside>

  <main>
    <div class="grid" id="grid"></div>

    <section class="cases">
      <div class="case" data-case="plain block">Plain block, no site cursor</div>
      <div class="case">
        <textarea rows="2" data-case="textarea (inherits)"></textarea>
        <div class="resize" data-case="resize handle (site ns-resize)"></div>
      </div>
      <div class="case grab" data-case="drag area (site grab)">Drag area</div>
      <div class="case player" data-case="video player (site cursor: none)">Video player</div>
      <div class="case"><open-widget></open-widget></div>
      <div class="case"><closed-widget></closed-widget></div>
      <div class="case">
        <button id="open-dialog" data-case="opens a modal dialog">Open dialog</button>
        <button popovertarget="pop" data-case="opens a popover">Open popover</button>
      </div>
      <div class="case">
        <button id="rewrite-head" data-case="rewrite document.head (SPA)">Rewrite head</button>
      </div>
    </section>

    <h3>Iframes</h3>
    <section class="cases">
      <div class="case">Same origin<iframe id="f-same" height="140"></iframe></div>
      <div class="case">Cross origin (port + 1)<iframe id="f-cross" height="140"></iframe></div>
      <div class="case">Short, 50px<iframe id="f-short" height="50"></iframe></div>
      <div class="case">srcdoc<iframe id="f-srcdoc" height="140" srcdoc="<p>srcdoc frame</p>"></iframe></div>
    </section>

    <p>
      <button id="run" data-case="Run checks button">Run checks</button>
      <a href="short.html" data-case="link to short page">Short page</a>
    </p>
    <table id="report"></table>
  </main>

  <dialog id="dialog">
    <p data-case="inside modal dialog">Modal dialog</p>
    <button onclick="this.closest('dialog').close()" data-case="dialog close button">Close</button>
  </dialog>
  <div id="pop" popover data-case="inside popover">Popover</div>

  <script src="check.js"></script>
  <script>
    window.fixtureShadowRoots = [];

    const mini = document.getElementById('mini');
    for (let d = 1; d <= 30; d++) {
      const day = document.createElement('div');
      day.className = 'day';
      day.textContent = d;
      if (d === 11) day.dataset.case = 'sidebar: mini calendar day (cursor: pointer)';
      mini.append(day);
    }

    const grid = document.getElementById('grid');
    for (let i = 0; i < 7 * 6; i++) {
      const slot = document.createElement('div');
      slot.className = 'slot';
      slot.setAttribute('jsaction', 'click:slot');
      if (i === 9) slot.dataset.case = 'grid: time slot (jsaction div, cursor: pointer)';
      if (i === 17) {
        const chip = document.createElement('div');
        chip.className = 'chip';
        chip.textContent = 'Design review';
        chip.dataset.case = 'grid: event chip (site cursor: pointer !important)';
        slot.append(chip);
      }
      grid.append(slot);
    }

    // Shadow DOM components whose inner button sets its own cursor, the way a
    // web component's stylesheet would. Purrsor's document stylesheet does not
    // reach inside, so the content script adds its rules to each shadow root.
    for (const mode of ['open', 'closed']) {
      customElements.define(`${mode}-widget`, class extends HTMLElement {
        constructor() {
          super();
          const root = this.attachShadow({ mode });
          root.innerHTML = `
            <style>button { cursor: pointer; }</style>
            <button data-case="${mode} shadow root: button (cursor: pointer)">${mode} shadow button</button>
            <span data-case="${mode} shadow root: plain span (inherits)">span</span>`;
          window.fixtureShadowRoots.push(root);
        }
      });
    }

    const port = Number(location.port || 80);
    document.getElementById('f-same').src = 'frame.html';
    document.getElementById('f-cross').src = `${location.protocol}//${location.hostname}:${port + 1}/frame.html`;
    document.getElementById('f-short').src = 'frame.html';
    document.getElementById('f-srcdoc').srcdoc = '<p data-case="srcdoc frame text">srcdoc frame</p>';

    document.getElementById('open-dialog').onclick = () => document.getElementById('dialog').showModal();
    document.getElementById('rewrite-head').onclick = () => {
      document.head.innerHTML = '<title>Purrsor fixture: head rewritten</title>';
    };

    // Collect this document's report plus one from each iframe that runs check.js.
    window.purrsorReport = async () => {
      const reports = [purrsorCheck()];
      const frames = [...document.querySelectorAll('iframe')];
      const replies = new Promise((resolve) => {
        const got = [];
        const onMessage = (event) => {
          if (event.data && event.data.purrsorReport) got.push(event.data.purrsorReport);
        };
        window.addEventListener('message', onMessage);
        setTimeout(() => { window.removeEventListener('message', onMessage); resolve(got); }, 500);
      });
      for (const frame of frames) frame.contentWindow.postMessage('purrsor-check', '*');
      reports.push(...await replies);
      // srcdoc frames do not load check.js; read them directly.
      const srcdoc = document.getElementById('f-srcdoc').contentDocument;
      const sigs = purrsorSignatures();
      const row = srcdoc.querySelector('[data-case]');
      const got = purrsorClassify(srcdoc.defaultView.getComputedStyle(row).cursor, sigs);
      reports.push({ frame: 'about:srcdoc', styleInjected: got === 'idle', rows: [{ case: row.dataset.case, expect: 'idle', got, pass: got === 'idle' }] });
      return reports;
    };

    document.getElementById('run').onclick = async () => {
      const table = document.getElementById('report');
      table.innerHTML = '<tr><th>frame</th><th>case</th><th>expect</th><th>got</th></tr>';
      for (const report of await window.purrsorReport()) {
        const rows = report.rows.length ? report.rows : [{ case: '(no cases)', expect: 'style injected', got: String(report.styleInjected), pass: report.styleInjected }];
        for (const row of rows) {
          const tr = table.insertRow();
          if (!row.pass) tr.className = 'fail';
          for (const value of [report.frame.replace(location.origin, ''), row.case, row.expect, row.got.slice(0, 40)]) {
            tr.insertCell().textContent = value;
          }
        }
      }
    };
  </script>
</body>
</html>
