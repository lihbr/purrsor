<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Purrsor</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup" id="popup">
    <header class="topbar">
      <div>
        <h1 class="wordmark">Purrsor</h1>
        <p class="status" id="status" aria-live="polite">On</p>
      </div>
      <label class="switch large">
        <input type="checkbox" id="enabledToggle" aria-label="Purrsor" aria-describedby="status" checked>
        <span class="switch-track"></span>
      </label>
    </header>

    <button type="button" class="stage" id="stage" aria-describedby="stageHint">
      <span class="stage-cat">
        <img id="stageIdle" alt="" width="112" height="76">
        <img id="stageSlap" alt="" width="112" height="76" hidden>
      </span>
      <span class="stage-desk"></span>
      <span class="stage-hint" id="stageHint">Click to try it</span>
    </button>

    <section class="rows" aria-label="Where it plays">
      <div class="row">
        <div class="row-text">
          <label class="row-label" for="siteToggle">On this site</label>
          <span class="row-detail" id="currentSite">…</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="siteToggle" aria-describedby="currentSite" checked>
          <span class="switch-track"></span>
        </label>
      </div>
      <div class="row">
        <div class="row-text">
          <label class="row-label" for="soundToggle">Sound</label>
          <span class="row-detail" id="soundDetail">Plays on every click</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="soundToggle" aria-describedby="soundDetail" checked>
          <span class="switch-track"></span>
        </label>
      </div>
    </section>

    <section class="cursors" aria-labelledby="cursorsTitle">
      <h2 class="cursors-title" id="cursorsTitle">Cursor</h2>
      <div class="tiles">
        <div class="tile-group" id="tiles" role="radiogroup" aria-labelledby="cursorsTitle"></div>
        <button type="button" class="tile tile-new" id="newCursor">
          <span class="tile-art" aria-hidden="true">+</span>
          <span class="tile-name">New</span>
        </button>
      </div>
    </section>

    <footer class="footer">
      <button type="button" class="text-button" id="openSettings">Settings</button>
      <button type="button" class="text-button" id="manageExtension">Manage extension</button>
    </footer>
  </main>

  <template id="tileTemplate">
    <label class="tile">
      <input type="radio" name="template" class="visually-hidden">
      <span class="tile-art"><img alt="" width="64" height="44"></span>
      <span class="tile-name"></span>
    </label>
  </template>

  <script src="../shared/templates.js"></script>
  <script src="../shared/pages.js"></script>
  <script src="popup.js"></script>
</body>
</html>
