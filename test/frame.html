<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Purrsor fixture: iframe</title>
  <style>
    body { margin: 0; font: 13px system-ui, sans-serif; }
    .row { display: flex; gap: 8px; padding: 8px; }
    .chip { padding: 4px 8px; background: #e8f0fe; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="row">
    <span data-case="frame: text">Frame text</span>
    <div class="chip" data-case="frame: chip (cursor: pointer)">Chip</div>
    <a href="#" data-case="frame: link">Link</a>
  </div>
  <script src="check.js"></script>
</body>
</html>
